[package]
name = "ftf-zipcrypto"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

# The attack is compute-heavy, so optimise for speed (opt-level 3), not size, in the Wasm build.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.test]
opt-level = 3
